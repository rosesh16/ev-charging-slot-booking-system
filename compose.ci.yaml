services:
  db:
    image: postgres:17
    restart: "no"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ci_evcharging}
      POSTGRES_USER: ${POSTGRES_USER:-ci_evapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ci_secret_test_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-ci_evapp} -d $${POSTGRES_DB:-ci_evcharging}"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 3s

  web:
    build: .
    restart: "no"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ci_evcharging}
      POSTGRES_USER: ${POSTGRES_USER:-ci_evapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ci_secret_test_password}
      DB_HOST: db
      DB_PORT: "5432"
      SECRET_KEY: ${SECRET_KEY:-ci-ephemeral-dummy-key-not-for-production-use-39281729}
      DEBUG: "0"
      ALLOWED_HOSTS: localhost,127.0.0.1,web
    depends_on:
      db:
        condition: service_healthy
