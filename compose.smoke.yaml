services:
  db:
    image: postgres:17
    restart: "no"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smoke_evcharging}
      POSTGRES_USER: ${POSTGRES_USER:-smoke_evapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smoke_secret_test_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-smoke_evapp} -d $${POSTGRES_DB:-smoke_evcharging}"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 3s

  web:
    build: .
    restart: "no"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smoke_evcharging}
      POSTGRES_USER: ${POSTGRES_USER:-smoke_evapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smoke_secret_test_password}
      DB_HOST: db
      DB_PORT: "5432"
      SECRET_KEY: ${SECRET_KEY:-smoke-ephemeral-dummy-key-not-for-production-use-84729184}
      DEBUG: "0"
      ALLOWED_HOSTS: localhost,127.0.0.1,web,nginx
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: ev-charging-slot-booking-nginx:ci
    build:
      context: .
      dockerfile: nginx/Dockerfile
    restart: "no"
    ports:
      - "127.0.0.1:${SMOKE_NGINX_PORT:-8085}:80"
    depends_on:
      - web
